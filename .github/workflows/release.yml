name: Release

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Increase swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 4

      - name: Guard against merge commits from pull requests
        if: github.event_name == 'push'
        run: |
          parent_count=$(git rev-list --parents -n 1 "$GITHUB_SHA" | awk '{print NF-1}')
          if [ "$parent_count" -ne 1 ]; then
            echo "::error::Release via PR merge commit is blocked. Create a dedicated direct commit on main with '[release]'."
            exit 1
          fi

      - name: Resolve version and release tag from gradle.properties
        id: release_tag
        run: |
          mod_version=$(grep -E '^(version|mod_version)=' gradle.properties | head -n 1 | cut -d '=' -f 2- | tr -d '\r' | xargs)
          if [ -z "$mod_version" ]; then
            echo "::error::Could not read version from gradle.properties"
            exit 1
          fi
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$mod_version" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag if missing
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag '$RELEASE_TAG' already exists. Reusing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi

      - name: Extract changelog entry
        id: changelog
        run: |
          version="${{ steps.release_tag.outputs.mod_version }}"
          if [ -f CHANGELOG.md ]; then
            notes=$(awk -v ver="$version" '
              $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
              flag && /^## \[/ { exit }
              flag { print }
            ' CHANGELOG.md)
            if [ -n "$notes" ]; then
              echo "Found changelog entry for $version in CHANGELOG.md"
              echo "$notes" > release_notes.md
              echo "has_notes=true" >> "$GITHUB_OUTPUT"
            else
              echo "No changelog entry found for $version in CHANGELOG.md"
              touch release_notes.md
              echo "has_notes=false" >> "$GITHUB_OUTPUT"
            fi
          else
            touch release_notes.md
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew --no-daemon build -Prelease=true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: MarketBlocks ${{ steps.release_tag.outputs.mod_version }}
          body_path: release_notes.md
          files: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-javadoc.jar
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-javadoc.jar
          generate_release_notes: true
