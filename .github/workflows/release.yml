name: Release

on:
  push:
    branches:
      - "main"
      - "1.21.1"
      - "1.21.4"
      - "1.21.11"
      - "26.1.2"
      - "26.2"
      - "26.3"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (Testlauf: Build & Metadaten pruefen ohne echten Upload)'
        required: true
        type: boolean
        default: false
      publish_github:
        description: 'Auf GitHub Releases veroeffentlichen'
        required: true
        type: boolean
        default: true
      publish_modrinth:
        description: 'Auf Modrinth veroeffentlichen'
        required: true
        type: boolean
        default: true
      publish_curseforge:
        description: 'Auf CurseForge veroeffentlichen'
        required: true
        type: boolean
        default: true
      release_title:
        description: 'Optionaler Update-Titel (z.B. "The Living Economy & Trader Update"). Leer lassen fuer Standard-Format.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Increase swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 4

      - name: Guard against merge commits from pull requests
        if: github.event_name == 'push'
        run: |
          parent_count=$(git rev-list --parents -n 1 "$GITHUB_SHA" | awk '{print NF-1}')
          if [ "$parent_count" -ne 1 ]; then
            echo "::error::Release via PR merge commit is blocked. Create a dedicated direct commit with '[release]'."
            exit 1
          fi

      - name: Resolve version, tag and Java version from gradle.properties
        id: release_tag
        run: |
          mod_version=$(grep -E '^(version|mod_version)=' gradle.properties | head -n 1 | cut -d '=' -f 2- | tr -d '\r' | xargs)
          mc_version=$(grep -E '^minecraft_version=' gradle.properties | head -n 1 | cut -d '=' -f 2- | tr -d '\r' | xargs)
          java_version=$(grep -E '^java_version=' gradle.properties | head -n 1 | cut -d '=' -f 2- | tr -d '\r' | xargs)
          if [ -z "$mod_version" ] || [ -z "$mc_version" ]; then
            echo "::error::Could not read version or minecraft_version from gradle.properties"
            exit 1
          fi
          java_ver="${java_version:-21}"
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "mc_version=$mc_version" >> "$GITHUB_OUTPUT"
          echo "java_version=$java_ver" >> "$GITHUB_OUTPUT"
          echo "full_version=${mod_version}+${mc_version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${mod_version}+${mc_version}" >> "$GITHUB_OUTPUT"

          # Release title handling (Minecraft modding convention)
          custom_title="${{ github.event.inputs.release_title }}"
          if [ -n "$custom_title" ]; then
            echo "display_name=MarketBlocks ${mod_version} [${mc_version}] - ${custom_title}" >> "$GITHUB_OUTPUT"
            echo "name_fabric=MarketBlocks ${mod_version} - ${custom_title} for Fabric ${mc_version}" >> "$GITHUB_OUTPUT"
            echo "name_neoforge=MarketBlocks ${mod_version} - ${custom_title} for NeoForge ${mc_version}" >> "$GITHUB_OUTPUT"
          else
            echo "display_name=MarketBlocks ${mod_version} [${mc_version}]" >> "$GITHUB_OUTPUT"
            echo "name_fabric=MarketBlocks ${mod_version} for Fabric ${mc_version}" >> "$GITHUB_OUTPUT"
            echo "name_neoforge=MarketBlocks ${mod_version} for NeoForge ${mc_version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine publish targets
        id: targets
        run: |
          dry_run="${{ github.event.inputs.dry_run }}"
          if [ "$dry_run" = "true" ]; then
            echo "is_dry_run=true" >> "$GITHUB_OUTPUT"
            echo "publish_github=false" >> "$GITHUB_OUTPUT"
            echo "publish_modrinth=false" >> "$GITHUB_OUTPUT"
            echo "publish_curseforge=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_dry_run=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "publish_github=true" >> "$GITHUB_OUTPUT"
              echo "publish_modrinth=true" >> "$GITHUB_OUTPUT"
              echo "publish_curseforge=true" >> "$GITHUB_OUTPUT"
            else
              gh_in="${{ github.event.inputs.publish_github }}"
              mr_in="${{ github.event.inputs.publish_modrinth }}"
              cf_in="${{ github.event.inputs.publish_curseforge }}"
              echo "publish_github=${gh_in:-true}" >> "$GITHUB_OUTPUT"
              echo "publish_modrinth=${mr_in:-true}" >> "$GITHUB_OUTPUT"
              echo "publish_curseforge=${cf_in:-true}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Create and push release tag if missing
        if: steps.targets.outputs.is_dry_run != 'true' && (steps.targets.outputs.publish_github == 'true' || steps.targets.outputs.publish_modrinth == 'true' || steps.targets.outputs.publish_curseforge == 'true')
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag '$RELEASE_TAG' already exists. Reusing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi

      - name: Extract changelog entry
        id: changelog
        run: |
          full_ver="${{ steps.release_tag.outputs.full_version }}"
          mod_ver="${{ steps.release_tag.outputs.mod_version }}"
          if [ -f CHANGELOG.md ]; then
            notes=$(awk -v fver="$full_ver" -v mver="$mod_ver" '
              BEGIN {
                target1 = "## [" fver "]";
                target2 = "## [" mver "]";
              }
              index($0, target1) == 1 || index($0, target2) == 1 { flag = 1; next }
              flag && /^## \[/ { exit }
              flag { print }
            ' CHANGELOG.md)
            if [ -n "$notes" ]; then
              echo "Found changelog entry in CHANGELOG.md"
              echo "$notes" > release_notes.md
              echo "has_notes=true" >> "$GITHUB_OUTPUT"
            else
              echo "No changelog entry found in CHANGELOG.md"
              touch release_notes.md
              echo "has_notes=false" >> "$GITHUB_OUTPUT"
            fi
          else
            touch release_notes.md
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.release_tag.outputs.java_version }}
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew --no-daemon build -Prelease=true

      - name: Dry Run Summary
        if: steps.targets.outputs.is_dry_run == 'true'
        run: |
          echo "================================================="
          echo "               DRY RUN VERIFICATION              "
          echo "================================================="
          echo "Mod Version:       ${{ steps.release_tag.outputs.mod_version }}"
          echo "Minecraft Version: ${{ steps.release_tag.outputs.mc_version }}"
          echo "Full Version:      ${{ steps.release_tag.outputs.full_version }}"
          echo "Release Tag:       ${{ steps.release_tag.outputs.tag }}"
          echo "Display Name:      ${{ steps.release_tag.outputs.display_name }}"
          echo "Environment:       client | server (Both Required)"
          echo "Java Version:      ${{ steps.release_tag.outputs.java_version }}"
          echo "-------------------------------------------------"
          echo "Target Platforms (Live Run Selection):"
          echo "  - GitHub Releases: ${{ github.event.inputs.publish_github }}"
          echo "  - Modrinth:        ${{ github.event.inputs.publish_modrinth }}"
          echo "  - CurseForge:      ${{ github.event.inputs.publish_curseforge }}"
          echo "-------------------------------------------------"
          echo "CurseForge Token configured: ${{ secrets.CURSEFORGE_TOKEN != '' }}"
          echo "CurseForge Project ID:       1713762"
          echo "Modrinth Token configured:   ${{ secrets.MODRINTH_TOKEN != '' }}"
          echo "Modrinth Project ID:         apfBVEsm"
          echo "-------------------------------------------------"
          echo "Extracted Changelog Notes:"
          cat release_notes.md
          echo "-------------------------------------------------"
          echo "Built Artifacts:"
          ls -lh fabric/build/libs/*.jar neoforge/build/libs/*.jar
          echo "================================================="
          echo "Dry run successful. No files were published to GitHub, Modrinth, or CurseForge."

      - name: Publish GitHub release
        if: steps.targets.outputs.publish_github == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "${{ steps.release_tag.outputs.display_name }}"
          body_path: release_notes.md
          files: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-javadoc.jar
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-javadoc.jar
          generate_release_notes: true

      - name: Publish Fabric to Modrinth
        if: steps.targets.outputs.publish_modrinth == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: "apfBVEsm"
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: "fabric/build/libs/marketblocks-fabric-${{ steps.release_tag.outputs.mc_version }}-${{ steps.release_tag.outputs.mod_version }}.jar"
          name: "${{ steps.release_tag.outputs.name_fabric }}"
          version: "${{ steps.release_tag.outputs.full_version }}-fabric"
          version-type: release
          loaders: fabric
          game-versions: "${{ steps.release_tag.outputs.mc_version }}"
          java: ${{ steps.release_tag.outputs.java_version }}
          environment: client | server
          changelog-file: release_notes.md

      - name: Publish Fabric to CurseForge
        if: steps.targets.outputs.publish_curseforge == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: "1713762"
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: "fabric/build/libs/marketblocks-fabric-${{ steps.release_tag.outputs.mc_version }}-${{ steps.release_tag.outputs.mod_version }}.jar"
          name: "${{ steps.release_tag.outputs.name_fabric }}"
          version-type: release
          loaders: fabric
          game-versions: "${{ steps.release_tag.outputs.mc_version }}"
          java: ${{ steps.release_tag.outputs.java_version }}
          environment: client | server
          changelog-file: release_notes.md

      - name: Publish NeoForge to Modrinth
        if: steps.targets.outputs.publish_modrinth == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: "apfBVEsm"
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: "neoforge/build/libs/marketblocks-neoforge-${{ steps.release_tag.outputs.mc_version }}-${{ steps.release_tag.outputs.mod_version }}.jar"
          name: "${{ steps.release_tag.outputs.name_neoforge }}"
          version: "${{ steps.release_tag.outputs.full_version }}-neoforge"
          version-type: release
          loaders: neoforge
          game-versions: "${{ steps.release_tag.outputs.mc_version }}"
          java: ${{ steps.release_tag.outputs.java_version }}
          environment: client | server
          changelog-file: release_notes.md

      - name: Publish NeoForge to CurseForge
        if: steps.targets.outputs.publish_curseforge == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: "1713762"
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: "neoforge/build/libs/marketblocks-neoforge-${{ steps.release_tag.outputs.mc_version }}-${{ steps.release_tag.outputs.mod_version }}.jar"
          name: "${{ steps.release_tag.outputs.name_neoforge }}"
          version-type: release
          loaders: neoforge
          game-versions: "${{ steps.release_tag.outputs.mc_version }}"
          java: ${{ steps.release_tag.outputs.java_version }}
          environment: client | server
          changelog-file: release_notes.md
