name: Dev Release

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-release:
    name: Build and Update Dev Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[dev]') || contains(github.event.head_commit.message, '[test]'))) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increase swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew --no-daemon build

      - name: Clean up previous dev-latest release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag >/dev/null 2>&1 || true

      - name: Publish or Update Dev Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          target_commitish: ${{ github.sha }}
          name: "MarketBlocks Dev Build (Latest)"
          body: |
            Automatischer Test-Build für Tester und Freunde.
            Dieser Release wird immer mit der neuesten Entwicklungsversion überschrieben.
            
            **Commit:** `${{ github.sha }}`
          files: build/libs/*.jar
          prerelease: true
          make_latest: false
